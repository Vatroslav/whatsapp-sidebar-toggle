<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WhatsApp Web Sidebar Toggle</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="row">
      <span class="title">Sidebar</span>
      <label class="switch">
        <input id="toggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
    <p class="hint">Shortcut: Ctrl + Shift + S</p>
    <script src="popup.js"></script>
  </body>
</html>
